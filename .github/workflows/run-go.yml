name: Run Go Script

on:
  workflow_dispatch: # 手動実行用

# リポジトリへファイルをコミット・プッシュするための書き込み権限を付与
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Go環境の準備
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Goプログラムの実行
        run: go run main.go

      - name: 変更があればリポジトリにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.md
          # 差分がある場合のみコミット
          git diff --staged --quiet || git commit -m "Update articles.md [skip ci]"
          git push
