name: Run Go Script

on:
  workflow_dispatch: # 手動実行用
  schedule:
    # 15分ごと（毎時 0分, 15分, 30分, 45分）に定期実行
    - cron: '7,27,47 * * * *'

    # 毎日 日本時間 4:00, 12:00, 20:00（UTC 19:00, 03:00, 11:00）に定期実行
    # - cron: '7 3,11,19 * * *'

# リポジトリへファイルをコミット・プッシュするための書き込み権限を付与
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Go環境の準備
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Goプログラムの実行
        run: go run main.go

      - name: 変更があればリポジトリにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.md
          # 差分がある場合のみコミット
          git diff --staged --quiet || git commit -m "Update articles.md [skip ci]"
          git push
